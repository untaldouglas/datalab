version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  poc-network:
    name: poc-university-network
    driver: bridge

volumes:
  postgres_data:
  mssql_data:
  dbgate_data:
  minio_data:
  dremio_data:
  opensearch_data:
  openmetadata_data:

services:
  # ==========================================
  # 1. CAPA TRANSACCIONAL (Databases Fuentes)
  # ==========================================
  postgres-source:
    image: postgres:16-alpine
    container_name: poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodle_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PostgresPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - poc-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poc-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MssqlPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./seeds:/seeds:ro
    networks:
      - poc-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  seed-postgres:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: "PostgresPassword123!"
    volumes:
      - ./seeds:/seeds:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres-source", "-U", "postgres", "-d", "moodle_db", "-f", "/seeds/moodle.sql"]
    depends_on:
      postgres-source:
        condition: service_healthy
    networks:
      - poc-network

  dbgate:
    image: dbgate/dbgate:7.3.0-alpine
    container_name: poc-dbgate
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    environment:
      CONNECTIONS: moodle,erp
      LABEL_moodle: Moodle (solo lectura)
      SERVER_moodle: postgres-source
      PORT_moodle: 5432
      DATABASE_moodle: moodle_db
      USER_moodle: lab_viewer
      PASSWORD_moodle: LabViewerPassword123!
      ENGINE_moodle: postgres@dbgate-plugin-postgres
      LABEL_erp: ERP (solo lectura)
      SERVER_erp: mssql-source
      PORT_erp: 1433
      DATABASE_erp: erpnext_db
      USER_erp: lab_viewer
      PASSWORD_erp: LabViewerPassword123!
      ENGINE_erp: mssql@dbgate-plugin-mssql
    depends_on:
      postgres-source:
        condition: service_healthy
      mssql-source:
        condition: service_healthy
    networks:
      - poc-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. CAPA DE ALMACENAMIENTO LAKEHOUSE (MinIO)
  # ==========================================
  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: poc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: MinioPassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - poc-network
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /bin/bash -c 'exec 3<>/dev/tcp/localhost/9000 &&
          printf "GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n" >&3 &&
          IFS= read -r response <&3 && [[ "$$response" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: quay.io/minio/mc:latest
    container_name: poc-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin MinioPassword123!;
      /usr/bin/mc mb myminio/university-lakehouse || true;
      /usr/bin/mc mb myminio/openrag-docs || true;
      exit 0;
      "
    networks:
      - poc-network

  # ==========================================
  # 3. CAPA MOTOR LAKEHOUSE Y FEDERACIÓN (Dremio)
  # ==========================================
  dremio:
    image: dremio/dremio-oss:latest
    container_name: poc-dremio
    restart: unless-stopped
    ports:
      - "9047:9047"   # Web UI
      - "31010:31010" # Client Port / ODBC
      - "45678:45678" # Arrow Flight
    environment:
      DREMIO_JAVA_SERVER_EXTRA_OPTS: "-Dauto.start.embedded.master=true"
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - poc-network
    logging: *default-logging

  # ==========================================
  # 4. CAPA BÚSQUEDA Y VECTORIAL (OpenSearch)
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: poc-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=poc-cluster
      - node.name=poc-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - poc-network
    logging: *default-logging

  # ==========================================
  # 5. CAPA INTELIGENCIA ARTIFICIAL / RAG (Langflow / OpenRAG)
  # ==========================================
  langflow:
    image: langflowai/langflow:latest
    container_name: poc-langflow
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      LANGFLOW_HOST: "0.0.0.0"
      LANGFLOW_PORT: 7860
      LANGFLOW_SUPERUSER: "admin"
      LANGFLOW_SUPERUSER_PASSWORD: "LangflowPassword123!"
    networks:
      - poc-network
    logging: *default-logging

  # ==========================================
  # 6. CAPA GOBERNANZA DE DATOS (OpenMetadata)
  # ==========================================
  postgres-init-openmetadata:
    image: postgres:16-alpine
    container_name: poc-postgres-init-openmetadata
    restart: "no"
    environment:
      PGPASSWORD: "PostgresPassword123!"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        psql -h postgres-source -U postgres -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'openmetadata_db'" |
        grep -q 1 || psql -h postgres-source -U postgres -d postgres -c
        "CREATE DATABASE openmetadata_db;"
    depends_on:
      postgres-source:
        condition: service_healthy
    networks:
      - poc-network
    logging: *default-logging

  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.3.1
    container_name: poc-openmetadata-migrate
    restart: "no"
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      DB_DRIVER_CLASS: "org.postgresql.Driver"
      DB_SCHEME: "postgresql"
      DB_USE_SSL: "false"
      DB_HOST: "postgres-source"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_USER_PASSWORD: "PostgresPassword123!"
      OM_DATABASE: "openmetadata_db"
      SEARCH_TYPE: "opensearch"
      SEARCH_HOST: "opensearch"
      SEARCH_PORT: "9200"
      SEARCH_SCHEME: "http"
    depends_on:
      postgres-init-openmetadata:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
    networks:
      - poc-network
    logging: *default-logging

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.3.1
    container_name: poc-openmetadata
    restart: unless-stopped
    environment:
      SERVER_HOST_API_URL: "http://localhost:8585/api"
      DB_DRIVER_CLASS: "org.postgresql.Driver"
      DB_SCHEME: "postgresql"
      DB_USE_SSL: "false"
      DB_HOST: "postgres-source"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_USER_PASSWORD: "PostgresPassword123!"
      OM_DATABASE: "openmetadata_db"
      SEARCH_TYPE: "opensearch"
      SEARCH_HOST: "opensearch"
      SEARCH_PORT: "9200"
      SEARCH_SCHEME: "http"
    ports:
      - "8585:8585"
    depends_on:
      postgres-source:
        condition: service_healthy
      postgres-init-openmetadata:
        condition: service_completed_successfully
      openmetadata-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_started
    networks:
      - poc-network
    logging: *default-logging
